version: "3.8"

services:
  sharephotos:
    container_name: sharephotos
    build: .
    image: sharephotos:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - FACE_WORKER_MODE=${FACE_WORKER_MODE:-remote}
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_PREFIX=${OSS_PREFIX:-}
      - OSS_SIGNED_URL_EXPIRES=${OSS_SIGNED_URL_EXPIRES:-3600}
    volumes:
      - ./data:/app/data
      - ./models:/home/app/.insightface

  face-worker:
    container_name: sharephotos-face-worker
    build: .
    image: sharephotos:latest
    profiles:
      - server-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - FACE_WORKER_MODE=redis
      - REDIS_URL=redis://redis:6379/0
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_PREFIX=${OSS_PREFIX:-}
      - OSS_SIGNED_URL_EXPIRES=${OSS_SIGNED_URL_EXPIRES:-3600}
    volumes:
      - ./data:/app/data
      - ./models:/home/app/.insightface
    command: ["python", "face_worker.py"]

  redis:
    image: redis:7-alpine
    container_name: sharephotos-redis
    restart: unless-stopped
    profiles:
      - server-worker

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
