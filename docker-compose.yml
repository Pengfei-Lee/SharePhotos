version: "3.8"

services:
  sharephotos:
    container_name: sharephotos
    build: .
    image: sharephotos:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - FACE_WORKER_MODE=${FACE_WORKER_MODE:-remote}
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_PREFIX=${OSS_PREFIX:-}
      - OSS_SIGNED_URL_EXPIRES=${OSS_SIGNED_URL_EXPIRES:-3600}
      - OSS_AUTO_MIGRATE=${OSS_AUTO_MIGRATE:-0}
    volumes:
      - ./data:/app/data
      - ./models:/home/app/.insightface

  face-worker:
    container_name: sharephotos-face-worker
    build: .
    image: sharephotos:latest
    profiles:
      - server-worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - DATA_DIR=/app/data
      - FACE_WORKER_MODE=redis
      - WORKER_API_URL=${WORKER_API_URL:-}
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_PREFIX=${OSS_PREFIX:-}
      - OSS_SIGNED_URL_EXPIRES=${OSS_SIGNED_URL_EXPIRES:-3600}
      - OSS_AUTO_MIGRATE=${OSS_AUTO_MIGRATE:-0}
    volumes:
      - ./data:/app/data
      - ./models:/home/app/.insightface
    command: ["python", "face_worker.py"]

  redis:
    image: redis:7-alpine
    container_name: sharephotos-redis
    restart: unless-stopped
    profiles:
      - server-worker
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}
    command:
      - sh
      - -c
      - redis-server --appendonly yes --bind 0.0.0.0 --protected-mode no --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
