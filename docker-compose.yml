version: "3.8"

services:
  sharephotos:
    container_name: sharephotos
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./models:/home/app/.insightface

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: