<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share Album Demo</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">SA</span>
          <div>
            <h1>共享相册</h1>
            <p>多人上传 · 自动归类 · 文件夹下载</p>
          </div>
        </div>

        <form id="albumForm" class="new-album">
          <label for="albumName">新建相册</label>
          <div class="inline">
            <input id="albumName" name="name" placeholder="例如：五一团建" autocomplete="off" />
            <button type="submit">创建</button>
          </div>
        </form>

        <nav id="albumList" class="album-list" aria-label="相册列表"></nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Demo workspace</p>
            <h2 id="currentAlbumTitle">请选择或创建一个相册</h2>
          </div>
          <div id="stats" class="stats"></div>
        </header>

        <section id="emptyState" class="empty">
          <div>
            <h3>先创建一个相册</h3>
            <p>然后用不同上传者名称上传照片。服务端会使用 OpenCV 检测照片中的人脸，并根据人脸特征把相似人物整理到同一个文件夹；没有检测到人脸的照片会进入“未识别人脸”。</p>
          </div>
        </section>

        <section id="albumPanel" class="album-panel hidden">
          <form id="uploadForm" class="upload-card">
            <div class="form-grid">
              <label>
                上传者
                <input id="uploader" name="uploader" placeholder="你的名字" value="访客" />
              </label>
            </div>
            <label class="dropzone" for="photos">
              <input id="photos" name="photos" type="file" accept="image/*" multiple />
              <span>选择或拖入照片</span>
              <small id="selectedFiles">上传后自动进行人脸识别</small>
            </label>
            <div class="upload-actions">
              <button id="uploadButton" type="submit">上传并自动整理</button>
              <span id="uploadStatus"></span>
            </div>
          </form>

          <div id="folders" class="folders"></div>
          <section id="allPhotos" class="album-section"></section>
          <section id="folderDetail" class="folder-detail hidden"></section>
        </section>
      </section>
    </main>

    <dialog id="photoViewer" class="photo-viewer">
      <button id="closeViewer" class="viewer-close" type="button" aria-label="关闭">×</button>
      <img id="viewerImage" alt="" />
      <div id="viewerMeta" class="viewer-meta"></div>
    </dialog>

    <script src="/assets/app.js"></script>
  </body>
</html>
