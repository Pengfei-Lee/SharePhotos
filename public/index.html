<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharePhotos</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="album-context" aria-live="polite">
          <button id="backToHome" class="secondary" type="button">返回</button>
          <div>
            <strong id="albumContextName">相册</strong>
            <span>回到首页</span>
          </div>
        </div>
        <div class="brand">
          <span class="brand-mark">SA</span>
          <div>
            <h1>SharePhotos</h1>
            <p>朋友拍的你，一键收齐</p>
          </div>
        </div>
        <div class="subalbum-context" aria-live="polite">
          <button id="mobileBackToFolders" class="secondary" type="button">返回</button>
          <div>
            <strong id="subalbumAlbumName">相册</strong>
            <span>切换小相册</span>
          </div>
        </div>

        <nav id="albumList" class="album-list" aria-label="相册列表"></nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Friends photo swap</p>
            <h2 id="currentAlbumTitle">请选择或创建一个相册</h2>
          </div>
          <div id="stats" class="stats"></div>
        </header>

        <section id="emptyState" class="empty">
          <div>
            <h3>暂无相册</h3>
            <p>创建一个相册后，就可以邀请朋友一起上传照片。</p>
          </div>
        </section>

        <section id="homeAlbums" class="home-albums hidden"></section>

        <section id="albumPanel" class="album-panel hidden">
          <div id="folders" class="folders"></div>

          <button id="toggleUploadForm" class="upload-toggle" type="button">上传照片</button>

          <form id="uploadForm" class="upload-card">
            <div class="upload-intro">
              <div>
                <p class="eyebrow">My camera roll</p>
                <h3>把我手机里的朋友视角加进来</h3>
              </div>
              <span>上传完就能继续玩，后台会慢慢整理</span>
            </div>
            <div class="form-grid">
              <label>
                你是谁
                <input id="uploader" name="uploader" placeholder="不填写则默认为访客" autocomplete="name" />
              </label>
            </div>
            <label class="dropzone" for="photos">
              <input id="photos" name="photos" type="file" accept="image/*,video/quicktime,video/mp4,.mov,.heic,.heif" multiple />
              <span>点这里从相册选择照片</span>
              <small id="selectedFiles">手机上可以一次多选；上传后先入库，再在后台生成预览和人物小相册</small>
            </label>
            <div class="upload-actions">
              <button id="uploadButton" type="submit">加入照片池</button>
              <span id="uploadStatus"></span>
            </div>
          </form>

          <section id="allPhotos" class="album-section"></section>
          <section id="folderDetail" class="folder-detail hidden"></section>
        </section>
      </section>
    </main>

    <dialog id="photoViewer" class="photo-viewer">
      <button id="closeViewer" class="viewer-close" type="button" aria-label="关闭">×</button>
      <img id="viewerImage" alt="" />
      <div id="viewerMeta" class="viewer-meta"></div>
    </dialog>

    <button id="openCreateAlbum" class="create-album-fab" type="button">创建新相册</button>

    <dialog id="createAlbumDialog" class="create-album-dialog">
      <form id="albumForm" method="dialog" class="create-album-form">
        <div>
          <p class="eyebrow">New album</p>
          <h3>这次出游叫什么</h3>
        </div>
        <input id="albumName" name="name" placeholder="例如：重庆周末小队" autocomplete="off" />
        <div class="dialog-actions">
          <button id="cancelCreateAlbum" class="secondary" type="button">取消</button>
          <button type="submit">创建</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/app.js"></script>
  </body>
</html>
