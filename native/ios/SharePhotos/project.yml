name: SharePhotos
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.12
targets:
  SharePhotos:
    type: application
    platform: iOS
    sources:
      - SharePhotos
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        CFBundleDisplayName: "识我"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2026062104"
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "需要读取你的照片和实况照片，用于上传到共享相册。"
        NSPhotoLibraryAddUsageDescription: "需要写入系统相册，用于保存下载后的照片和实况照片。"
        NSCameraUsageDescription: "需要使用相机扫描相册二维码，用于加入共享相册。"
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharephotos.app
        PRODUCT_NAME: PicMe
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: SharePhotos.entitlements
        APS_ENVIRONMENT: development
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Release:
          APS_ENVIRONMENT: production
